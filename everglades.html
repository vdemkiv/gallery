<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Everglades Corridor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>body{background:#1d1c1a;color:#f4ece1}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="rooms.js"></script>
<script>
/* A long, quiet corridor: pale plaster walls, polished dark concrete, one light line overhead.
   Nine prints at 48 × 60 in, framed with a white mat, hung on alternating walls. */
ROOMS.run({
  back:'index.html',
  title:'Everglades', subtitle:'Volodymyr Demkiv · Florida',
  label:'A long gallery corridor hung with nine large Everglades prints',
  bg:'#1d1c1a', exposure:.82, poolStrength:.42,
  meta:'Gelatin silver print on fiber-based paper, made by hand by the artist<br>48 × 60 in, framed · Edition of 5 + 1 AP',
  build(ctx){
    const {THREE,scene,tex,grain,rnd,IN,addWork,bench}=ctx;
    const Wd=4.6, L=46, H=4.6, x0=-Wd/2, x1=Wd/2, z0=-L, z1=0;
    scene.fog=new THREE.Fog(0x1d1c1a,18,52);
    const plaster=tex(1024,1024,(g,w,h)=>{g.fillStyle='#e4e0d9';g.fillRect(0,0,w,h);
      for(let i=0;i<160;i++){g.globalAlpha=.05;g.fillStyle=Math.random()<.5?'#f2efe9':'#cfcac1';g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(40,200),rnd(30,120),rnd(0,3),0,7);g.fill();}
      g.globalAlpha=1;grain(g,w,h,6);},[L/4,1]);
    const concrete=tex(1024,1024,(g,w,h)=>{g.fillStyle='#57544f';g.fillRect(0,0,w,h);
      for(let i=0;i<120;i++){g.globalAlpha=.06;g.fillStyle=Math.random()<.5?'#6c6862':'#45423e';g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(30,160),rnd(20,90),rnd(0,3),0,7);g.fill();}
      g.globalAlpha=.25;g.strokeStyle='#3c3a36';g.lineWidth=2;g.beginPath();g.moveTo(0,1);g.lineTo(w,1);g.stroke();
      g.globalAlpha=1;grain(g,w,h,12);},[1,L/4.6]);
    const wallMat=new THREE.MeshStandardMaterial({map:plaster,roughness:.95});
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(Wd,L),new THREE.MeshStandardMaterial({map:concrete,roughness:.28,metalness:.05}));
    floor.rotation.x=-Math.PI/2;floor.position.set(0,0,-L/2);floor.name='floor';scene.add(floor);
    const ceil=new THREE.Mesh(new THREE.PlaneGeometry(Wd,L),new THREE.MeshStandardMaterial({color:0x2b2a28,roughness:1}));
    ceil.rotation.x=Math.PI/2;ceil.position.set(0,H,-L/2);scene.add(ceil);
    const lw=new THREE.Mesh(new THREE.PlaneGeometry(L,H),wallMat);lw.position.set(x0,H/2,-L/2);lw.rotation.y=Math.PI/2;scene.add(lw);
    const rw=new THREE.Mesh(new THREE.PlaneGeometry(L,H),wallMat);rw.position.set(x1,H/2,-L/2);rw.rotation.y=-Math.PI/2;scene.add(rw);
    const endMat=new THREE.MeshStandardMaterial({map:plaster.clone(),roughness:.95});endMat.map.repeat.set(1,1);
    const end=new THREE.Mesh(new THREE.PlaneGeometry(Wd,H),endMat);end.position.set(0,H/2,z0);scene.add(end);
    const back=new THREE.Mesh(new THREE.PlaneGeometry(Wd,H),endMat);back.position.set(0,H/2,z1);back.rotation.y=Math.PI;scene.add(back);
    // light line overhead and a shadow gap at the floor
    const slot=new THREE.Mesh(new THREE.BoxGeometry(.06,.01,L-.6),new THREE.MeshBasicMaterial({color:0xfff2de}));slot.position.set(0,H-.006,-L/2);scene.add(slot);
    const gapMat=new THREE.MeshBasicMaterial({color:0x151412});
    [[x0+.003,Math.PI/2],[x1-.003,-Math.PI/2]].forEach(([x,r])=>{const s=new THREE.Mesh(new THREE.PlaneGeometry(L,.03),gapMat);s.position.set(x,.015,-L/2);s.rotation.y=r;scene.add(s);});
    scene.add(new THREE.HemisphereLight(0xfff4e6,0x3a3631,.55));
    scene.add(new THREE.AmbientLight(0xffffff,.08));
    for(let z=-4;z>-L;z-=8){const p=new THREE.PointLight(0xffe9cf,.55,11,2);p.position.set(0,H-.3,z);scene.add(p);}
    // the nine: landscape 60 × 48, portrait 48 × 60, alternating walls, staggered
    const items=[['Lilies Under the Thicket',60,48],['Willow Slough',60,48],['Cypress and Lilies',60,48],['Pine Pond',60,48],['Cypress Strand',60,48],
                 ['Water Lily, Reeds',48,60],['Palmetto Frond',48,60],['Spanish Moss',48,60],['Single Reed',48,60]];
    const order=[0,5,1,6,2,7,3,8,4];
    order.forEach((idx,k)=>{
      const [t,w,h]=items[idx], left=k%2===0, z=-5-k*4.4;
      addWork({title:t,file:`img/everglades-${String(idx+1).padStart(2,'0')}.jpg`,w,h,mat:5,mould:1.25,
        pos:new THREE.Vector3(left?x0+.001:x1-.001,1.72,z),normal:new THREE.Vector3(left?1:-1,0,0)});
    });
    const oak=new THREE.MeshStandardMaterial({color:0x8a6a4a,roughness:.6});
    bench(0,-13,Math.PI/2,oak,2.2);bench(0,-31,Math.PI/2,oak,2.2);
    const startPos=new THREE.Vector3(0,1.6,-1.2);
    return {bounds:{x0:x0+.7,x1:x1-.7,z0:z0+.8,z1:z1-.6},eye:1.6,
      start:{pos:startPos,look:new THREE.Vector3(0,1.62,z0)},
      views:[{label:'Corridor',pos:startPos,look:new THREE.Vector3(0,1.62,z0)},
             {label:'Far end',pos:new THREE.Vector3(0,1.6,z0+2),look:new THREE.Vector3(0,1.62,0)}]};
  }
});
</script>
