<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Half Fruit Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>body{background:#2a221b;color:#f4ece1}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="rooms.js"></script>
<script>
/* Warm travertine room after the artist's mockup: low sun, a window onto palms and sea, one walnut bench.
   The nine Half Fruit prints hang as at photoMIAMI 2026: 12 x 16 in, framed 16 x 20 in. */
ROOMS.run({
  back:'index.html',
  title:'Half Fruit', subtitle:'Volodymyr Demkiv · Kraków, 2022–23',
  label:'Walkable 3D room showing the nine Half Fruit prints',
  bg:'#2a221b', exposure:.74, pools:false, printTint:0xd9d4cc,
  meta:'Gelatin silver print, made by hand by the artist<br>12 × 16 in, framed 16 × 20 in · Edition of 5 + 1 AP',
  build(ctx){
    const {THREE,scene,tex,grain,rnd,blob,softShadow,addWork,bench}=ctx;
    const ROOM={x0:-3.6,x1:4.2,z0:-3.0,z1:3.2,h:3.15};
    // travertine: warm cream, soft horizontal strata, small pores
    const travertine=tex(2048,1024,(g,w,h)=>{
      g.fillStyle='#d2c2a6';g.fillRect(0,0,w,h);
      for(let i=0;i<60;i++){g.globalAlpha=rnd(.03,.08);g.fillStyle=Math.random()<.5?'#efe0c4':'#c2aa86';
        const y=rnd(0,h),th=rnd(4,40);g.beginPath();g.moveTo(0,y);
        for(let x=0;x<=w;x+=64)g.lineTo(x,y+Math.sin(x/rnd(180,400))*rnd(4,16));
        g.lineTo(w,y+th);for(let x=w;x>=0;x-=64)g.lineTo(x,y+th+Math.sin(x/300)*8);g.fill();}
      for(let i=0;i<220;i++){g.globalAlpha=.07;g.fillStyle='#fff3dc';g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(40,180),rnd(20,70),0,0,7);g.fill();}
      g.globalAlpha=.35;for(let i=0;i<1400;i++){g.fillStyle='#a98f6b';g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(1,4),rnd(.5,1.5),0,0,7);g.fill();}
      g.globalAlpha=1;grain(g,w,h,10);
    });
    // limestone floor tiles: 1.2 m squares with fine joints
    const stoneFloor=tex(1024,1024,(g,w,h)=>{
      for(let tx=0;tx<2;tx++)for(let ty=0;ty<2;ty++){
        g.globalAlpha=1;g.fillStyle=['#cfb899','#c9b192','#d2bc9d','#cbb394'][tx*2+ty];g.fillRect(tx*w/2,ty*h/2,w/2,h/2);
        for(let i=0;i<30;i++){g.globalAlpha=.06;g.fillStyle=Math.random()<.5?'#e6d6bb':'#b29a7a';g.beginPath();g.ellipse(tx*w/2+rnd(0,w/2),ty*h/2+rnd(0,h/2),rnd(20,120),rnd(8,40),rnd(0,3),0,7);g.fill();}
      }
      g.globalAlpha=.5;g.strokeStyle='#a48c6d';g.lineWidth=2;
      g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.moveTo(0,h/2);g.lineTo(w,h/2);g.moveTo(1,0);g.lineTo(1,h);g.moveTo(0,1);g.lineTo(w,1);g.stroke();
      g.globalAlpha=1;grain(g,w,h,8);
    },[(ROOM.x1-ROOM.x0)/2.4,(ROOM.z1-ROOM.z0)/2.4]);
    // dark walnut planks for the ceiling
    const walnut=tex(1024,1024,(g,w,h)=>{
      const pw=128;for(let x=0;x<w;x+=pw){g.fillStyle=['#4a3324','#43301f','#503829','#3f2c1e'][(x/pw)%4];g.fillRect(x,0,pw,h);
        g.globalAlpha=.18;for(let i=0;i<26;i++){g.strokeStyle=Math.random()<.5?'#2c1e14':'#6b4c36';g.lineWidth=rnd(1,3);g.beginPath();let xx=x+rnd(4,pw-4);g.moveTo(xx,0);for(let y=0;y<=h;y+=32){xx+=rnd(-1.5,1.5);g.lineTo(xx,y);}g.stroke();}
        g.globalAlpha=.6;g.fillStyle='#21160e';g.fillRect(x,0,2,h);g.globalAlpha=1;}
      grain(g,w,h,8);
    },[3,3]);
    const jute=tex(512,512,(g,w,h)=>{
      g.fillStyle='#9c7d55';g.fillRect(0,0,w,h);
      for(let y=0;y<h;y+=8)for(let x=0;x<w;x+=16){const o=(y/8)%2?8:0;g.fillStyle=Math.random()<.5?'#b3946a':'#8a6c47';g.beginPath();g.ellipse(x+o+8,y+4,7,3.2,0,0,7);g.fill();}
      grain(g,w,h,18);
    },[3,5]);
    const boucle=tex(512,512,(g,w,h)=>{
      g.fillStyle='#e6dccb';g.fillRect(0,0,w,h);
      for(let i=0;i<9000;i++){g.fillStyle=Math.random()<.5?'rgba(255,250,240,.5)':'rgba(170,155,130,.35)';g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(1,3),0,7);g.fill();}
    },[3,3]);
    
    // low sun coming through the window: soft bands with palm fronds cut out
    function sunPatch(w,h,bands,fronds,skew){
      return tex(w,h,(g)=>{
        g.filter='blur(14px)';
        bands.forEach(b=>{g.fillStyle=`rgba(255,196,128,${b.a})`;g.beginPath();g.moveTo(b.x,0);g.lineTo(b.x+b.w,0);g.lineTo(b.x+b.w+skew,h);g.lineTo(b.x+skew,h);g.fill();});
        g.globalCompositeOperation='destination-out';g.filter='blur(6px)';
        for(let i=0;i<fronds;i++){
          const cx=rnd(0,w*.7),cy=rnd(0,h*.8),ang=rnd(-.4,.9),len=rnd(160,320);
          g.save();g.translate(cx,cy);g.rotate(ang);g.strokeStyle='rgba(0,0,0,.75)';g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*.5,-20,len,10);g.stroke();
          for(let t=.1;t<1;t+=.07){const px=len*t,py=-20*4*t*(1-t)+10*t;g.lineWidth=4;g.beginPath();g.moveTo(px,py);g.lineTo(px+rnd(10,30),py-rnd(40,70)*(1-t*.6));g.moveTo(px,py);g.lineTo(px+rnd(10,30),py+rnd(40,70)*(1-t*.6));g.stroke();}
          g.restore();
        }
        g.filter='none';g.globalCompositeOperation='destination-in';
        const fx=g.createLinearGradient(0,0,w,0);fx.addColorStop(0,'rgba(0,0,0,0)');fx.addColorStop(.18,'#000');fx.addColorStop(.7,'#000');fx.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=fx;g.fillRect(0,0,w,h);
        const fy=g.createLinearGradient(0,0,0,h);fy.addColorStop(0,'rgba(0,0,0,0)');fy.addColorStop(.15,'#000');fy.addColorStop(.85,'#000');fy.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=fy;g.fillRect(0,0,w,h);
      },null);
    }
    
    // ---------- room ----------
    const W=ROOM.x1-ROOM.x0, D=ROOM.z1-ROOM.z0, CX=(ROOM.x0+ROOM.x1)/2, CZ=(ROOM.z0+ROOM.z1)/2;
    const stoneMat=new THREE.MeshStandardMaterial({map:travertine,roughness:.9});
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map:stoneFloor,roughness:.38,metalness:0}));
    floor.rotation.x=-Math.PI/2;floor.position.set(CX,0,CZ);floor.name='floor';scene.add(floor);
    const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map:walnut,roughness:.7}));
    ceil.rotation.x=Math.PI/2;ceil.position.set(CX,ROOM.h,CZ);scene.add(ceil);
    // main stone wall (the nine hang here)
    const main=new THREE.Mesh(new THREE.PlaneGeometry(W,ROOM.h),stoneMat);main.position.set(CX,ROOM.h/2,ROOM.z0);scene.add(main);
    // back wall and right wall: stone, with a walnut niche on the right
    const back=new THREE.Mesh(new THREE.PlaneGeometry(W,ROOM.h),stoneMat);back.position.set(CX,ROOM.h/2,ROOM.z1);back.rotation.y=Math.PI;scene.add(back);
    const right=new THREE.Mesh(new THREE.PlaneGeometry(D,ROOM.h),stoneMat);right.position.set(ROOM.x1,ROOM.h/2,CZ);right.rotation.y=-Math.PI/2;scene.add(right);
    const woodMat=new THREE.MeshStandardMaterial({map:walnut,roughness:.6});
    const niche=new THREE.Mesh(new THREE.BoxGeometry(.06,ROOM.h,1.6),woodMat);niche.position.set(ROOM.x1-.03,ROOM.h/2,ROOM.z0+1.9);scene.add(niche);
    const cove=new THREE.Mesh(new THREE.BoxGeometry(.02,.02,1.4),new THREE.MeshBasicMaterial({color:0xffc98a}));cove.position.set(ROOM.x1-.07,ROOM.h-.25,ROOM.z0+1.9);scene.add(cove);
    
    // left wall: floor-to-ceiling window onto palms and sea
    const outside=tex(2048,1024,(g,w,h)=>{
      const sky=g.createLinearGradient(0,0,0,h*.62);sky.addColorStop(0,'#c9d6dc');sky.addColorStop(.7,'#ecd9bd');sky.addColorStop(1,'#f4d7a8');
      g.fillStyle=sky;g.fillRect(0,0,w,h*.62);
      g.fillStyle='rgba(150,150,150,.35)';for(let i=0;i<14;i++){const x=rnd(w*.35,w*.95),bw=rnd(30,70),bh=rnd(40,150);g.fillRect(x,h*.62-bh,bw,bh);}
      const sea=g.createLinearGradient(0,h*.62,0,h*.8);sea.addColorStop(0,'#8fa7ad');sea.addColorStop(1,'#6e8a8f');g.fillStyle=sea;g.fillRect(0,h*.62,w,h*.18);
      g.fillStyle='rgba(255,230,190,.25)';for(let i=0;i<120;i++)g.fillRect(rnd(0,w),rnd(h*.63,h*.79),rnd(10,40),1.5);
      g.fillStyle='#6f7a55';g.fillRect(0,h*.8,w,h*.2);
      g.fillStyle='rgba(60,70,40,.9)';for(let i=0;i<40;i++){g.beginPath();g.ellipse(rnd(0,w),h*.82,rnd(40,120),rnd(20,50),0,0,7);g.fill();}
      function palm(x,base,hgt){g.strokeStyle='#4f4a3a';g.lineWidth=10;g.beginPath();g.moveTo(x,base);g.quadraticCurveTo(x+30,base-hgt*.5,x+15,base-hgt);g.stroke();
        const tx=x+15,ty=base-hgt;g.strokeStyle='#3d4a2c';
        for(let a=0;a<14;a++){const ang=-Math.PI+a*(Math.PI/13)+rnd(-.1,.1),l=rnd(110,170);g.lineWidth=3;g.beginPath();g.moveTo(tx,ty);const ex=tx+Math.cos(ang)*l,ey=ty+Math.sin(ang)*l*.6+l*.35;g.quadraticCurveTo(tx+Math.cos(ang)*l*.5,ty+Math.sin(ang)*l*.5-20,ex,ey);g.stroke();
          for(let t=.15;t<1;t+=.08){const px=tx+(ex-tx)*t,py=ty+(ey-ty)*t-10*Math.sin(t*3);g.lineWidth=2;g.beginPath();g.moveTo(px,py);g.lineTo(px+rnd(-12,12),py+rnd(14,26));g.stroke();}}}
      palm(w*.12,h*.95,h*.55);palm(w*.22,h*.97,h*.42);palm(w*.66,h*.98,h*.5);
    });
    const win=new THREE.Mesh(new THREE.PlaneGeometry(D*1.6,ROOM.h*1.5),new THREE.MeshBasicMaterial({map:outside,color:0xd8cfc2}));
    win.position.set(ROOM.x0-2.2,ROOM.h*.62,CZ);win.rotation.y=Math.PI/2;scene.add(win);
    const frameDark=new THREE.MeshStandardMaterial({color:0x1c1712,roughness:.5,metalness:.3});
    for(let z=ROOM.z0;z<=ROOM.z1+.01;z+=D/4){const m=new THREE.Mesh(new THREE.BoxGeometry(.08,ROOM.h,.06),frameDark);m.position.set(ROOM.x0,ROOM.h/2,z);scene.add(m);}
    [0.03,ROOM.h-.03].forEach(y=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.06,D),frameDark);m.position.set(ROOM.x0,y,CZ);scene.add(m);});
    // a stone pier between window and main wall, like the mockup
    const pier=new THREE.Mesh(new THREE.BoxGeometry(.6,ROOM.h,.5),stoneMat);pier.position.set(ROOM.x0+.3,ROOM.h/2,ROOM.z0+.25);scene.add(pier);
    
    // sunlight on the main wall and the floor
    const wallSun=new THREE.Mesh(new THREE.PlaneGeometry(4.2,ROOM.h),new THREE.MeshBasicMaterial({map:sunPatch(1024,768,[{x:-150,w:260,a:.55},{x:170,w:180,a:.45},{x:420,w:120,a:.3}],7,520),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.42}));
    wallSun.position.set(ROOM.x0+2.4,ROOM.h/2,ROOM.z0+.004);scene.add(wallSun);
    const floorSun=new THREE.Mesh(new THREE.PlaneGeometry(5.5,D),new THREE.MeshBasicMaterial({map:sunPatch(1024,1024,[{x:-40,w:240,a:.5},{x:300,w:220,a:.45},{x:620,w:200,a:.35}],6,-260),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.36}));
    floorSun.rotation.x=-Math.PI/2;floorSun.rotation.z=Math.PI/2;floorSun.position.set(ROOM.x0+2.75,.003,CZ+.2);scene.add(floorSun);
    
    // recessed downlights
    const canMat=new THREE.MeshBasicMaterial({color:0x111111}),lampMat=new THREE.MeshBasicMaterial({color:0xfff0d8});
    [[-1.4,ROOM.z0+1],[1.4,ROOM.z0+1],[-1.4,ROOM.z0+3.2],[1.4,ROOM.z0+3.2],[3.4,ROOM.z0+1.9]].forEach(([x,z])=>{
      const c=new THREE.Mesh(new THREE.PlaneGeometry(.13,.13),canMat);c.rotation.x=Math.PI/2;c.position.set(x,ROOM.h-.002,z);scene.add(c);
      const l=new THREE.Mesh(new THREE.CircleGeometry(.03,20),lampMat);l.rotation.x=Math.PI/2;l.position.set(x,ROOM.h-.004,z);scene.add(l);
    });
    
    // ---------- light: dim, warm, low ----------
    scene.add(new THREE.HemisphereLight(0xffe8d0,0x4a3828,.45));
    scene.add(new THREE.AmbientLight(0xffd9b0,.12));
    const sun=new THREE.DirectionalLight(0xffc690,.55);sun.position.set(ROOM.x0-6,2.6,ROOM.z0+4);sun.target.position.set(1,1,ROOM.z0);scene.add(sun);scene.add(sun.target);
    function wash(x,z,tx,ty,tz,int){const s=new THREE.SpotLight(0xffd7a8,int,8,.55,1,1.6);s.position.set(x,ROOM.h-.05,z);s.target.position.set(tx,ty,tz);scene.add(s);scene.add(s.target);}
    wash(-.6,ROOM.z0+1,-.6,1.4,ROOM.z0,.9);wash(.8,ROOM.z0+1,.8,1.4,ROOM.z0,.9);
    wash(3.4,ROOM.z0+1.9,ROOM.x1,1,ROOM.z0+1.9,.6);
    
    // the nine, in hung order
    const GRID=['Tangerine','Banana','Apple','Tomato','Pomegranate','Persimmon','Lemon','Avocado','Pear'];
    const IN=ctx.IN, GAP=4*IN, GX=.35, CY=1.6, FW=20*IN, FH=16*IN;
    GRID.forEach((t,i)=>{const r=Math.floor(i/3),c=i%3;
      addWork({title:t,file:'img/'+t.toLowerCase()+'.jpg',w:16,h:12,mat:1.4,mould:.6,
        pos:new THREE.Vector3(GX+(c-1)*(FW+GAP),CY+(1-r)*(FH+GAP),ROOM.z0+.001),normal:new THREE.Vector3(0,0,1)});});
    bench(GX,ROOM.z0+2.9,0,woodMat,1.8);
    const look=new THREE.Vector3(GX,1.58,ROOM.z0);
    return {bounds:{x0:ROOM.x0+.6,x1:ROOM.x1-.6,z0:ROOM.z0+.55,z1:ROOM.z1-.4},eye:1.6,
      start:{pos:new THREE.Vector3(GX-.8,1.6,ROOM.z0+3.6),look:new THREE.Vector3(GX-.1,1.58,ROOM.z0)},
      views:[{label:'The nine',pos:cam=>{const vf=THREE.MathUtils.degToRad(cam.fov)/2,hf=Math.atan(Math.tan(vf)*cam.aspect);const d=Math.max(2.0,1.05/Math.tan(hf),.85/Math.tan(vf));return new THREE.Vector3(GX,1.6,ROOM.z0+d);},look},
             {label:'Whole room',pos:new THREE.Vector3(ROOM.x1-1.2,1.6,ROOM.z1-.6),look:new THREE.Vector3(ROOM.x0+1.6,1.4,ROOM.z0)}]};
  }
});
</script>
